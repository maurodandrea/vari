<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Gioco Pesca · anteprima</title>
<meta name="theme-color" content="#04101e">
<link rel="icon" href="../pesca/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--txt:#f2f7fb;--mut:#a9bccb;--acct:#2fe0cf;--grad:linear-gradient(135deg,#2fe0cf,#3b8cff)}
  *{box-sizing:border-box}html,body{margin:0;height:100%;background:#04101e;color:var(--txt);font:500 16px Outfit,system-ui,sans-serif}
  #start{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1200px 600px at 50% -10%,#0f4a6b 0,#04101e 60%)}
  .box{width:100%;max-width:420px;text-align:center}
  .logo{width:84px;height:84px;border-radius:26px;margin:0 auto 14px;display:grid;place-items:center;font-size:44px;background:var(--grad);box-shadow:0 18px 40px -12px rgba(47,224,207,.7)}
  h1{margin:0 0 6px;font-size:30px;letter-spacing:-.5px}p{color:var(--mut);margin:0 0 18px;line-height:1.45}
  input{width:100%;padding:15px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;font:600 18px Outfit,sans-serif;outline:none;text-align:center}
  input:focus{border-color:var(--acct)}
  button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:16px;background:var(--grad);color:#03282a;font:800 18px Outfit,sans-serif;cursor:pointer}
  button:disabled{opacity:.5}
  .note{font-size:13.5px;margin-top:16px}
  .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#03282a;background:#ffb547;border-radius:99px;padding:3px 10px;margin-bottom:12px}
</style></head>
<body>
<div id="start"><div class="box">
  <div class="logo">🎣</div><span class="tag">Anteprima</span>
  <h1>Gioco Pesca</h1>
  <p>Surfcasting sulla costa del Lazio: parti da dove sei, guida lungo la costa e scegli lo spot. Meteo e mare sono quelli veri.</p>
  <input id="nm" maxlength="24" placeholder="Come ti chiami?" autocomplete="given-name">
  <button id="go" disabled>🚗 Inizia a guidare</button>
  <p class="note">Ti verrà chiesta la posizione per partire da dove ti trovi (puoi anche rifiutare).<br>Il gioco di LenzApp, l'app dei pescatori.</p>
</div></div>
<script>
// pagina a sé: carica solo il gioco di LenzApp (../pesca/gioco.js) con meteo, mare e costa che servono al gioco
const PB='../pesca/';
const nm=document.getElementById('nm'),bt=document.getElementById('go');
try{nm.value=localStorage.getItem('gp.name')||'';}catch(e){}
const upd=()=>{bt.disabled=nm.value.trim().length<2;};nm.oninput=upd;upd();
nm.onkeydown=e=>{if(e.key==='Enter'&&!bt.disabled)start();};bt.onclick=start;
// costa: linea di costa OpenStreetMap e località (stesso file dell'app)
let COSTA=null;
window.costa=async()=>{if(COSTA)return COSTA;const j=await (await fetch(PB+'costa.json')).json(),L=[];
  for(const a of j.c){let x=0,y=0;const p=[];let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(let i=0;i<a.length;i+=2){x+=a[i];y+=a[i+1];const X=x/1e4,Y=y/1e4;p.push(X,Y);if(X<x0)x0=X;if(X>x1)x1=X;if(Y<y0)y0=Y;if(Y>y1)y1=Y;}L.push({p,bb:[x0,y0,x1,y1]});}
  return COSTA={L,T:j.t};};
// meteo e mare reali (Open-Meteo)
const getJSON=async(u,ms=9000)=>{const ac=new AbortController(),t=setTimeout(()=>ac.abort(),ms);try{const r=await fetch(u,{signal:ac.signal});const j=await r.json();if(!r.ok||j.error||!j.hourly)throw new Error('bad');return j;}finally{clearTimeout(t);}};
window.fetchRaw=async sp=>{const tz='&timezone=auto&past_days=1&forecast_days=3';
  const wu=`https://api.open-meteo.com/v1/forecast?latitude=${sp.lat}&longitude=${sp.lon}&hourly=temperature_2m,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,cloud_cover,precipitation,weather_code${tz}`;
  const mu=`https://marine-api.open-meteo.com/v1/marine?latitude=${sp.lat}&longitude=${sp.lon}&hourly=wave_height,wave_period,sea_surface_temperature${tz}`;
  const [rw,rm]=await Promise.allSettled([getJSON(wu),getJSON(mu)]);if(rw.status!=='fulfilled')throw new Error('meteo');
  return {w:rw.value,m:rm.status==='fulfilled'?rm.value:null,sim:false};};
const parseLocal=s=>{const [a,b='00:00']=s.split('T');const [y,mo,da]=a.split('-').map(Number);const [h,mi]=b.split(':').map(Number);return new Date(y,mo-1,da,h,mi);};
// indice di pescosità semplificato: mare mosso ma non troppo, vento moderato, luce bassa
const idxOf=h=>{let s=55;const w=h.wave??.6;s+=w>=.4&&w<=1.4?12:w>2?-15:-4;s+=h.ws<20?6:h.ws>35?-12:0;const hr=h.t.getHours();s+=(hr<=8||hr>=17)?10:0;return Math.max(5,Math.min(95,Math.round(s)));};
window.build=(w,m)=>{const H=w.hourly,mi={};if(m&&m.hourly)m.hourly.time.forEach((t,i)=>mi[t]=i);
  const hours=H.time.map((t,i)=>{const k=mi[t],h={t:parseLocal(t),temp:H.temperature_2m[i],p:H.pressure_msl[i],ws:H.wind_speed_10m[i],wd:H.wind_direction_10m[i],wg:H.wind_gusts_10m[i],cc:H.cloud_cover[i],pr:H.precipitation[i],code:H.weather_code[i],
    wave:k!=null?m.hourly.wave_height[k]:null,wper:k!=null?m.hourly.wave_period[k]:null,sst:k!=null?m.hourly.sea_surface_temperature[k]:null};h.idx=idxOf(h);return h;});
  return {hours};};
// uscita dal gioco: si torna alla schermata iniziale
window.go=()=>{document.getElementById('start').style.display='';};
function start(){const n=nm.value.trim().slice(0,24);if(n.length<2)return;try{localStorage.setItem('gp.name',n);}catch(e){}window.GP_NAME=n;
  document.getElementById('start').style.display='none';
  if(window.GAME){GAME.mount(null);return;}
  bt.disabled=true;const sc=document.createElement('script');sc.src=PB+'gioco.js?v='+Date.now();
  sc.onload=()=>{bt.disabled=false;GAME.mount(null);};
  sc.onerror=()=>{bt.disabled=false;window.go();alert('Il gioco non si è caricato: controlla la connessione.');};
  document.body.appendChild(sc);}
</script>
</body></html>
